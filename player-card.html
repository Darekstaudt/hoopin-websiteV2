<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1e2d">
  <title>Player Card - Hoopin'</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    /* === RESET === */
    * {
      box-sizing: border-box;
    }

    /* === MOBILE: Simple Full-Width Layout === */
    @media (max-width: 768px) {
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        background: var(--bg-primary, #0a1929);
      }

      html {
        overflow-x: hidden;
        width: 100%;
      }

      /* Container - simple block, no fixed positioning */
      .container {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }

      .player-detail-container {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }

      .player-detail-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        display: block;
        background: var(--bg-secondary, #132f4c);
      }

      .player-detail-card .player-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 1rem;
        border-radius: 0;
        border: none;
        display: block;
        background: var(--bg-secondary, #132f4c);
      }

      /* Player photo - centered and properly sized */
      .player-photo {
        width: 100%;
        max-width: 280px;
        height: auto;
        margin: 0 auto;
        display: block;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      /* Ensure all child elements have proper padding */
      .player-card > * {
        width: 100%;
        box-sizing: border-box;
      }

      /* Stats grid responsive */
      .player-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        width: 100%;
        margin: 1.5rem 0;
      }

      .stat-item {
        text-align: center;
        padding: 0.75rem 0.5rem;
      }

      /* Tier badge mobile styling */
      .tier-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        margin: 1rem 0;
        border-radius: 12px;
      }

      /* Buttons full width on mobile */
      .player-card button {
        width: 100%;
        padding: 1rem;
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }

      /* Action buttons container */
      .player-card > div:last-child {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
      }

      .player-card > div:last-child button {
        flex: 1;
        min-width: auto;
      }
    }

    /* === DESKTOP: Centered Card === */
    @media (min-width: 769px) {
      body {
        padding: 1rem;
        background: var(--bg-primary, #0a1929);
      }

      .container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      .player-detail-card {
        max-width: 600px;
        margin: 2rem auto;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .player-detail-card .card {
        border-radius: 16px;
        background: var(--bg-secondary, #132f4c);
      }

      .player-actions {
        padding: 1.5rem;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }

      .player-actions .btn {
        padding: 0.875rem 1.5rem;
      }

      .stat-bars-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .cap-breakers-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }

    /* === COMMON STYLES === */
    .player-detail-card {
      background: var(--bg-secondary, #132f4c);
    }

    .player-name-display {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary, #fff);
      text-align: center;
      margin: 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Hide on load, show when ready */
    .player-detail-card {
      opacity: 1;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <button class="btn btn-icon" data-action="back">← Back</button>
      <div class="logo">🏀 Player Card</div>
      <button class="btn btn-icon" onclick="showPlayerMenu()">⋮</button>
    </div>
  </header>

  <div class="container page-transition player-detail-container">
    <div class="player-card-detailed player-detail-card" id="playerCard"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/performance.js"></script>
  <script src="js/db-manager.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/players.js"></script>
  <script src="js/app.js"></script>

  <script>
    let playerId = null;
    let currentPlayer = null;

    async function loadPlayerCard() {
      if (!playerId) return;

      showLoading('Loading player...');

      try {
        currentPlayer = await playerManager.getPlayerStats(playerId);
        hideLoading();

        if (!currentPlayer) {
          showToast('Player not found', 'error');
          return;
        }

        renderPlayerCard();
      } catch (error) {
        hideLoading();
        console.error('Load player error:', error);
        showToast('Failed to load player', 'error');
      }
    }

    function renderPlayerCard() {
      const container = document.getElementById('playerCard');
      const player = currentPlayer;

      const card = document.createElement('div');
      card.className = `player-card ${player.tierClass}`;

      card.innerHTML = `
        ${player.playerPhoto 
          ? `<img src="${player.playerPhoto}" class="player-photo" alt="${player.playerName}">`
          : '<div class="player-photo" style="margin: 0 auto; background: var(--secondary-bg); display: flex; align-items: center; justify-content: center; font-size: 4rem;">👤</div>'
        }

        <h2 class="text-center" style="margin-top: 1rem;">${sanitizeHTML(player.playerName)}</h2>

        <div class="tier-badge tier-${player.tierClass.replace('tier-', '')}" style="background: ${player.gradient}">
          <div class="tier-overall">${player.overall}</div>
          <div class="tier-name">${player.tier}</div>
          <div class="tier-rarity">${player.rarity}</div>
        </div>

        <div class="player-stats" style="grid-template-columns: repeat(3, 1fr); margin: 2rem 0;">
          <div class="stat-item">
            <div class="stat-label">Base Stats</div>
            <div class="stat-value">${player.baseTotal}</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Cap Breakers</div>
            <div class="stat-value">${player.capBreakerTotal}</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Overall</div>
            <div class="stat-value">${player.overall}</div>
          </div>
        </div>

        ${ratingsCalculator.createStatBars(player.stats, player.capBreakers)}

        <div style="display: flex; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap;">
          <button class="btn btn-primary" style="flex: 1; min-width: 120px;" onclick="editPlayer()">
            ✏️ Edit
          </button>
          <button class="btn btn-secondary" onclick="sharePlayer()">
            📤 Share
          </button>
          <button class="btn btn-accent" onclick="initiateSwap()">
            🔄 Swap
          </button>
          <button class="btn btn-danger" onclick="deletePlayer()">
            🗑️ Delete
          </button>
        </div>
      `;

      container.innerHTML = '';
      container.appendChild(card);
    }

    function editPlayer() {
      if (!currentPlayer) return;
      navigateToPage('player-add.html', { 
        teamId: currentPlayer.teamId, 
        playerId: currentPlayer.playerId 
      });
    }

    function initiateSwap() {
      if (!currentPlayer) {
        console.error('❌ No current player');
        showToast('Cannot start swap', 'error');
        return;
      }
      
      console.log('═══════════════════════════════════════');
      console.log('🔄 INITIATING SWAP MODE');
      console.log('Player:', currentPlayer.playerName, currentPlayer.playerId);
      console.log('Team:', currentPlayer.teamId);
      
      // Need to find player's current position
      // Store player info in session
      sessionStorage.setItem('swapPlayerId', currentPlayer.playerId);
      sessionStorage.setItem('swapPlayerName', currentPlayer.playerName);
      
      // Find current position (will be determined in roster view)
      findPlayerPositionAndNavigate();
    }

    async function findPlayerPositionAndNavigate() {
      try {
        showLoading('Loading...');
        
        // Get team roster
        const team = await dbManager.get('teams', currentPlayer.teamId);
        
        if (!team || !team.roster) {
          throw new Error('Team roster not found');
        }
        
        // Migrate if needed
        let roster = team.roster;
        if (!roster.positions) {
          console.log('🔄 Migrating roster...');
          const migratedTeam = await migrateRosterToPositions(currentPlayer.teamId);
          roster = migratedTeam.roster;
        }
        
        // Find player position
        let position = null;
        
        // Check positions
        for (const [pos, playerId] of Object.entries(roster.positions)) {
          if (playerId === currentPlayer.playerId) {
            position = pos;
            break;
          }
        }
        
        // Check bench
        if (!position) {
          const benchIdx = roster.bench.indexOf(currentPlayer.playerId);
          if (benchIdx >= 0) {
            position = `bench-${benchIdx}`;
          }
        }
        
        if (!position) {
          throw new Error('Player not found in roster');
        }
        
        console.log('📍 Current position:', position);
        
        // Store position
        sessionStorage.setItem('swapPosition', position);
        
        console.log('💾 Stored swap data in session');
        console.log('═══════════════════════════════════════');
        
        // Navigate
        navigateToPage('roster-view.html', { 
          teamId: currentPlayer.teamId
        });
        
      } catch (error) {
        console.error('❌ Error initiating swap:', error);
        showToast('Could not start swap: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    async function sharePlayer() {
      if (!currentPlayer) return;
      await shareData({
        title: `${currentPlayer.playerName} - ${currentPlayer.tier} (${currentPlayer.overall} OVR)`,
        text: `Check out this player on Hoopin'!`,
        url: window.location.href
      });
    }

    async function deletePlayer() {
      if (!currentPlayer) return;
      if (!confirm(`Delete ${currentPlayer.playerName}? This cannot be undone.`)) return;

      showLoading('Deleting player...');
      const result = await playerManager.deletePlayer(currentPlayer.playerId);
      hideLoading();

      if (result.success) {
        showToast('Player deleted', 'success');
        setTimeout(() => {
          navigateToPage('roster-view.html', { teamId: currentPlayer.teamId });
        }, 1000);
      } else {
        showToast('Failed to delete player', 'error');
      }
    }

    function showPlayerMenu() {
      const actions = [
        { label: 'Edit Player', action: editPlayer },
        { label: 'Share Player', action: sharePlayer },
        { label: 'Duplicate Player', action: duplicatePlayer },
        { label: 'Delete Player', action: deletePlayer }
      ];

      const menu = actions.map(a => `<button class="btn btn-block" onclick="${a.action.name}()">${a.label}</button>`).join('');

      const modal = document.createElement('div');
      modal.style.cssText = 'position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 1rem; border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-xl); z-index: 1000;';
      modal.innerHTML = menu + '<button class="btn btn-secondary btn-block" onclick="this.parentElement.remove()">Cancel</button>';
      document.body.appendChild(modal);
    }

    async function duplicatePlayer() {
      if (!currentPlayer) return;
      if (!confirm(`Duplicate ${currentPlayer.playerName}?`)) return;

      showLoading('Duplicating player...');
      const result = await playerManager.duplicatePlayer(currentPlayer.playerId);
      hideLoading();

      if (result.success) {
        showToast('Player duplicated!', 'success');
        setTimeout(() => loadPlayerCard(), 1000);
      } else {
        showToast('Failed to duplicate player', 'error');
      }
    }

    window.addEventListener('load', () => {
      setupCommonElements();
      playerId = getQueryParams().playerId;

      if (!playerId) {
        showToast('No player specified', 'error');
        navigateToPage('dashboard.html');
        return;
      }

      loadPlayerCard();
    });
  </script>
</body>
</html>
