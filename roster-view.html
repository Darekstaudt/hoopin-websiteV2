<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1e2d">
  <title>Team Roster - Hoopin'</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/divisions.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
/* Team Header */
.team-header {
  margin-bottom: 2rem;
}

.team-header h1 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--text-primary, #fff);
  margin-bottom: 1rem;
  text-align: center;
}

.team-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1rem;
}

.stat-card {
  background: rgba(255, 255, 255, 0.05);
  padding: 1rem;
  border-radius: 12px;
  text-align: center;
}

.stat-value {
  font-size: 2rem;
  font-weight: 900;
  color: var(--color-primary, #3b82f6);
  margin-bottom: 0.25rem;
}

.stat-label {
  font-size: 0.875rem;
  color: var(--text-muted, #94a3b8);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Roster Sections */
.roster-section {
  margin-bottom: 2rem;
}

.roster-section h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary, #fff);
  margin-bottom: 1rem;
}

/* Starters Container - Horizontal Scroll */
.starters-container {
  display: flex;
  gap: 1rem;
  overflow-x: auto;
  padding-bottom: 1rem;
  scroll-snap-type: x mandatory;
}

.starters-container::-webkit-scrollbar {
  height: 8px;
}

.starters-container::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 4px;
}

.starters-container::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
}

.starters-container::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* Bench Container - Grid */
.bench-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
}

@media (max-width: 768px) {
  .bench-container {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Player Cards */
.player-card {
  min-width: 220px;
  max-width: 220px;
  aspect-ratio: 2/3;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  scroll-snap-align: start;
  position: relative;
}

.bench-container .player-card {
  min-width: auto;
  max-width: 100%;
}

.player-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}

/* Swap mode styling */
.player-card.swap-source {
  opacity: 0.6;
  outline: 3px solid #f093fb;
  outline-offset: 4px;
}

/* Swap Mode Banner */
.swap-mode-banner {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  padding: 1rem 1.25rem;
  border-radius: 12px;
  margin-bottom: 1.5rem;
  box-shadow: 0 6px 20px rgba(240, 147, 251, 0.5);
  animation: slideDown 0.3s ease-out;
  position: sticky;
  top: 0;
  z-index: 100;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.swap-banner-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.swap-banner-text {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  font-size: 0.95rem;
}

.swap-banner-text strong {
  font-weight: 700;
}

.btn-cancel-swap {
  background: rgba(255, 255, 255, 0.25);
  color: white;
  border: 2px solid white;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-cancel-swap:hover {
  background: rgba(255, 255, 255, 0.35);
  transform: translateY(-2px);
}

.btn-cancel-swap:active {
  transform: translateY(0);
}

/* Empty state */
.empty-roster-message {
  padding: 3rem 2rem;
  text-align: center;
  color: var(--text-muted, #94a3b8);
  font-size: 1rem;
}

.empty-roster-message .icon {
  font-size: 4rem;
  opacity: 0.3;
  margin-bottom: 1rem;
}

/* Roster Actions */
.roster-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  margin-top: 2rem;
  padding-bottom: 2rem;
}

.roster-actions .btn {
  min-width: 160px;
}
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <button class="btn btn-icon" onclick="goBack()" title="Back to Dashboard">← Back</button>
      <div class="logo">🏀 Team Roster</div>
      <button class="btn btn-icon" onclick="showTeamMenu()">⋮</button>
    </div>
  </header>

  <div class="container page-transition">
    <!-- Swap banner will be inserted here -->
    
    <div class="team-header">
      <h1 id="teamName">Team Roster</h1>
      <div class="team-stats">
        <div class="stat-card">
          <div class="stat-value" id="totalPlayers">0</div>
          <div class="stat-label">Players</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="avgOverall">0</div>
          <div class="stat-label">Avg OVR</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="startersCount">0/5</div>
          <div class="stat-label">Starters</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="benchCount">0</div>
          <div class="stat-label">Bench</div>
        </div>
      </div>
    </div>

    <!-- Starting 5 -->
    <section class="roster-section">
      <h2>Starting 5</h2>
      <div class="starters-container" id="startersContainer">
        <!-- Player cards will be inserted here -->
      </div>
    </section>

    <!-- Bench -->
    <section class="roster-section">
      <h2>Bench</h2>
      <div class="bench-container" id="benchContainer">
        <!-- Player cards will be inserted here -->
      </div>
    </section>

    <div class="roster-actions">
      <button class="btn btn-primary" onclick="addPlayer()">
        ➕ Add Player
      </button>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/performance.js"></script>
  <script src="js/db-manager.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/players.js"></script>
  <script src="js/divisions.js"></script>
  <script src="js/app.js"></script>

  <script>
    let teamId = null;
    let currentTeam = null;

    // Swap mode state
    let swapMode = {
      active: false,
      sourcePlayerId: null,
      sourcePlayerName: null
    };

    // Check swap mode from session storage
    function checkSwapMode() {
      const storedPlayerId = sessionStorage.getItem('swapPlayerId');
      const storedPlayerName = sessionStorage.getItem('swapPlayerName');
      
      if (storedPlayerId && storedPlayerName) {
        swapMode.active = true;
        swapMode.sourcePlayerId = storedPlayerId;
        swapMode.sourcePlayerName = storedPlayerName;
        
        console.log('═══════════════════════════════════════');
        console.log('🔄 SWAP MODE ACTIVE');
        console.log('  Source Player ID:', storedPlayerId);
        console.log('  Source Player Name:', storedPlayerName);
        console.log('═══════════════════════════════════════');
        
        showSwapBanner();
        return true;
      }
      return false;
    }

    function showSwapBanner() {
      const existingBanner = document.querySelector('.swap-mode-banner');
      if (existingBanner) {
        existingBanner.remove();
      }
      
      const banner = document.createElement('div');
      banner.className = 'swap-mode-banner';
      banner.innerHTML = `
        <div class="swap-banner-content">
          <div class="swap-banner-text">
            <span style="font-size: 1.5rem;">🔄</span>
            <strong>SWAP MODE:</strong>
            <span>Tap another player to swap with <strong>${swapMode.sourcePlayerName}</strong></span>
          </div>
          <button class="btn-cancel-swap" onclick="cancelSwapMode()">
            ✕ Cancel
          </button>
        </div>
      `;
      
      const container = document.querySelector('.container');
      if (container) {
        container.insertBefore(banner, container.firstChild);
      }
    }

    function cancelSwapMode() {
      swapMode.active = false;
      swapMode.sourcePlayerId = null;
      swapMode.sourcePlayerName = null;
      
      sessionStorage.removeItem('swapPlayerId');
      sessionStorage.removeItem('swapPlayerName');
      
      console.log('❌ Swap mode cancelled');
      
      location.reload();
    }

    // Load roster
    async function loadRoster() {
      try {
        showLoading('Loading roster...');
        
        console.log('📋 Loading roster for team:', teamId);
        
        // Get team
        currentTeam = await dbManager.get('teams', teamId);
        
        if (!currentTeam) {
          throw new Error('Team not found');
        }
        
        console.log('📦 Team loaded:', currentTeam.teamName);
        console.log('📋 Roster structure:', JSON.stringify(currentTeam.roster, null, 2));
        
        // Handle roster format migration
        if (!currentTeam.roster) {
          // No roster - create new one
          currentTeam.roster = { starters: [], bench: [] };
          await dbManager.save('teams', teamId, currentTeam);
        } else if (currentTeam.roster.positions) {
          // Old position-based format - migrate back to array format
          console.log('🔄 Migrating from position-based to array-based format...');
          const positions = currentTeam.roster.positions;
          const oldBench = currentTeam.roster.bench || [];
          
          // Convert positions to starters array
          const starters = [
            positions.PG,
            positions.SG,
            positions.SF,
            positions.PF,
            positions.C
          ].filter(id => id !== null && id !== undefined);
          
          // Filter bench to remove nulls
          const bench = oldBench.filter(id => id !== null && id !== undefined);
          
          currentTeam.roster = { starters, bench };
          currentTeam.rosterFormat = 'arrays'; // Mark as migrated
          currentTeam.migratedAt = new Date().toISOString();
          
          await dbManager.save('teams', teamId, currentTeam);
          
          console.log('✅ Migration complete. New roster:', currentTeam.roster);
        } else {
          // Ensure arrays exist
          if (!currentTeam.roster.starters || !currentTeam.roster.bench) {
            currentTeam.roster.starters = currentTeam.roster.starters || [];
            currentTeam.roster.bench = currentTeam.roster.bench || [];
            await dbManager.save('teams', teamId, currentTeam);
          }
        }
        
        // Update team name
        document.getElementById('teamName').textContent = currentTeam.teamName;
        
        // Render starters and bench
        await renderStarters(currentTeam.roster.starters || []);
        await renderBench(currentTeam.roster.bench || []);
        
        // Update stats
        updateRosterStats();
        
      } catch (error) {
        console.error('❌ Error loading roster:', error);
        showToast('Failed to load roster: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    // Render starters
    async function renderStarters(starterIds) {
      const container = document.getElementById('startersContainer');
      
      if (starterIds.length === 0) {
        container.innerHTML = `
          <div class="empty-roster-message">
            <div class="icon">🏀</div>
            <div>No starters yet. Add players to build your Starting 5!</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      
      for (const playerId of starterIds) {
        try {
          const player = await playerManager.getPlayer(playerId);
          const card = createPlayerCard(player);
          container.appendChild(card);
        } catch (error) {
          console.error('Error loading starter:', playerId, error);
        }
      }
    }

    // Render bench
    async function renderBench(benchIds) {
      const container = document.getElementById('benchContainer');
      
      if (benchIds.length === 0) {
        container.innerHTML = `
          <div class="empty-roster-message">
            <div class="icon">💺</div>
            <div>No bench players yet.</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      
      for (const playerId of benchIds) {
        try {
          const player = await playerManager.getPlayer(playerId);
          const card = createPlayerCard(player);
          container.appendChild(card);
        } catch (error) {
          console.error('Error loading bench player:', playerId, error);
        }
      }
    }

    // Create player card element
    function createPlayerCard(player) {
      const card = document.createElement('div');
      card.className = `player-card ${player.tierClass}`;
      card.dataset.playerId = player.playerId;
      
      // Add swap source styling
      if (swapMode.active && player.playerId === swapMode.sourcePlayerId) {
        card.classList.add('swap-source');
      }
      
      card.innerHTML = `
        <div class="player-card-overall-badge">
          <div class="overall-number">${player.overall}</div>
        </div>
        <div class="player-card-body">
          <div class="player-card-stats-side">
            <div class="stat-line-compact"><strong>Face:</strong> ${player.stats.face}</div>
            <div class="stat-line-compact"><strong>Eyes:</strong> ${player.stats.eyes}</div>
            <div class="stat-line-compact"><strong>Top:</strong> ${player.stats.top}</div>
            <div class="stat-line-compact"><strong>Bottom:</strong> ${player.stats.bottom}</div>
            <div class="stat-line-compact"><strong>Fitness:</strong> ${player.stats.fitness}</div>
            <div class="stat-line-compact"><strong>Personality:</strong> ${player.stats.personality}</div>
          </div>
          <div class="player-card-photo-side">
            ${player.playerPhoto 
              ? `<img src="${player.playerPhoto}" alt="${player.playerName}">`
              : '<div class="player-icon-large">👤</div>'
            }
          </div>
        </div>
        <div class="player-card-name-bar">${sanitizeHTML(player.playerName)}</div>
      `;
      
      // Add click handler
      card.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handlePlayerCardClick(player.playerId, player.playerName);
      });
      
      return card;
    }

    // Handle player card click
    function handlePlayerCardClick(playerId, playerName) {
      if (swapMode.active) {
        // SWAP MODE - execute swap
        console.log('🎯 Player clicked in swap mode:', playerName, playerId);
        
        if (playerId === swapMode.sourcePlayerId) {
          showToast('Cannot swap a player with themselves!', 'error');
          return;
        }
        
        // Show confirmation
        const confirmed = confirm(
          `Swap players?\n\n` +
          `${swapMode.sourcePlayerName} ↔ ${playerName}\n\n` +
          `Tap OK to confirm.`
        );
        
        if (confirmed) {
          performSwap(swapMode.sourcePlayerId, playerId);
        }
      } else {
        // NORMAL MODE - view player
        viewPlayer(playerId);
      }
    }

    // Perform swap with explicit database operations
    async function performSwap(player1Id, player2Id) {
      try {
        showLoading('Swapping players...');
        
        console.log('═══════════════════════════════════════');
        console.log('🔄 SWAP EXECUTION START');
        console.log('Player 1 ID:', player1Id);
        console.log('Player 2 ID:', player2Id);
        console.log('Team ID:', teamId);
        console.log('═══════════════════════════════════════');
        
        // Step 1: Get fresh team data from database
        console.log('📥 Step 1: Fetching team from database...');
        const team = await dbManager.get('teams', teamId);
        
        if (!team) {
          throw new Error('Team not found in database');
        }
        
        if (!team.roster || !team.roster.starters || !team.roster.bench) {
          throw new Error('Invalid roster structure');
        }
        
        console.log('✅ Team fetched:', team.teamName);
        console.log('📋 Current roster before swap:');
        console.log('  Starters:', JSON.stringify(team.roster.starters));
        console.log('  Bench:', JSON.stringify(team.roster.bench));
        
        // Step 2: Find player positions
        console.log('📍 Step 2: Finding player positions...');
        
        const p1InStartersIdx = team.roster.starters.indexOf(player1Id);
        const p1InBenchIdx = team.roster.bench.indexOf(player1Id);
        const p2InStartersIdx = team.roster.starters.indexOf(player2Id);
        const p2InBenchIdx = team.roster.bench.indexOf(player2Id);
        
        console.log('Player 1 positions:');
        console.log('  In starters at index:', p1InStartersIdx);
        console.log('  In bench at index:', p1InBenchIdx);
        console.log('Player 2 positions:');
        console.log('  In starters at index:', p2InStartersIdx);
        console.log('  In bench at index:', p2InBenchIdx);
        
        // Step 3: Clone arrays to avoid mutation
        console.log('📋 Step 3: Cloning roster arrays...');
        const newStarters = [...team.roster.starters];
        const newBench = [...team.roster.bench];
        
        // Step 4: Perform swap based on locations
        console.log('🔄 Step 4: Performing swap...');
        
        let swapType = '';
        
        if (p1InStartersIdx >= 0 && p2InStartersIdx >= 0) {
          // Both in starters
          newStarters[p1InStartersIdx] = player2Id;
          newStarters[p2InStartersIdx] = player1Id;
          swapType = 'Both in starters';
        } else if (p1InBenchIdx >= 0 && p2InBenchIdx >= 0) {
          // Both in bench
          newBench[p1InBenchIdx] = player2Id;
          newBench[p2InBenchIdx] = player1Id;
          swapType = 'Both in bench';
        } else if (p1InStartersIdx >= 0 && p2InBenchIdx >= 0) {
          // P1 in starters, P2 in bench
          newStarters[p1InStartersIdx] = player2Id;
          newBench[p2InBenchIdx] = player1Id;
          swapType = 'P1 starter → bench, P2 bench → starter';
        } else if (p1InBenchIdx >= 0 && p2InStartersIdx >= 0) {
          // P1 in bench, P2 in starters
          newBench[p1InBenchIdx] = player2Id;
          newStarters[p2InStartersIdx] = player1Id;
          swapType = 'P1 bench → starter, P2 starter → bench';
        } else {
          throw new Error('Could not locate both players in roster');
        }
        
        console.log('✅ Swap type:', swapType);
        console.log('📋 New roster after swap:');
        console.log('  New starters:', JSON.stringify(newStarters));
        console.log('  New bench:', JSON.stringify(newBench));
        
        // Step 5: Update team object with new roster
        console.log('💾 Step 5: Updating team object...');
        team.roster = {
          starters: newStarters,
          bench: newBench
        };
        team.updatedAt = new Date().toISOString();
        team.lastSwap = {
          player1: player1Id,
          player2: player2Id,
          timestamp: new Date().toISOString(),
          type: swapType
        };
        
        console.log('📦 Updated team object:', {
          teamName: team.teamName,
          roster: team.roster,
          updatedAt: team.updatedAt
        });
        
        // Step 6: Save to database
        console.log('💾 Step 6: Saving to database...');
        await dbManager.save('teams', teamId, team);
        console.log('✅ Save complete (dbManager.save)');
        
        // Step 7: Verify the save worked
        console.log('🔍 Step 7: Verifying save...');
        const verifyTeam = await dbManager.get('teams', teamId);
        
        console.log('📋 Verification - Team after save:');
        console.log('  Team name:', verifyTeam.teamName);
        console.log('  Starters:', JSON.stringify(verifyTeam.roster.starters));
        console.log('  Bench:', JSON.stringify(verifyTeam.roster.bench));
        console.log('  Last swap:', verifyTeam.lastSwap);
        
        // Check if swap actually persisted
        const p1NewPosStarters = verifyTeam.roster.starters.indexOf(player1Id);
        const p1NewPosBench = verifyTeam.roster.bench.indexOf(player1Id);
        const p2NewPosStarters = verifyTeam.roster.starters.indexOf(player2Id);
        const p2NewPosBench = verifyTeam.roster.bench.indexOf(player2Id);
        
        console.log('🔍 Verification - New positions:');
        console.log('  Player 1 in starters:', p1NewPosStarters);
        console.log('  Player 1 in bench:', p1NewPosBench);
        console.log('  Player 2 in starters:', p2NewPosStarters);
        console.log('  Player 2 in bench:', p2NewPosBench);
        
        // Get player names for success message
        const p1 = await playerManager.getPlayer(player1Id);
        const p2 = await playerManager.getPlayer(player2Id);
        
        console.log('═══════════════════════════════════════');
        console.log('✅ SWAP COMPLETED SUCCESSFULLY');
        console.log(`   ${p1.playerName} ↔ ${p2.playerName}`);
        console.log('═══════════════════════════════════════');
        
        showToast(`✅ Swapped ${p1.playerName} ↔ ${p2.playerName}`, 'success');
        
        // Clear swap mode
        sessionStorage.removeItem('swapPlayerId');
        sessionStorage.removeItem('swapPlayerName');
        
        // Reload page after delay
        setTimeout(() => {
          console.log('🔄 Reloading page to display changes...');
          window.location.reload();
        }, 1500);
        
      } catch (error) {
        console.error('═══════════════════════════════════════');
        console.error('❌ SWAP FAILED');
        console.error('Error message:', error.message);
        console.error('Error stack:', error.stack);
        console.error('═══════════════════════════════════════');
        
        showToast('Swap failed: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    // Update roster stats
    function updateRosterStats() {
      const starters = currentTeam?.roster?.starters || [];
      const bench = currentTeam?.roster?.bench || [];
      const totalPlayers = starters.length + bench.length;
      
      document.getElementById('totalPlayers').textContent = totalPlayers;
      document.getElementById('startersCount').textContent = `${starters.length}/5`;
      document.getElementById('benchCount').textContent = bench.length;
      
      // Calculate average overall (will need to load players for this)
      calculateAverageOverall(starters, bench);
    }

    async function calculateAverageOverall(starterIds, benchIds) {
      try {
        const allPlayerIds = [...starterIds, ...benchIds];
        
        if (allPlayerIds.length === 0) {
          document.getElementById('avgOverall').textContent = '0';
          return;
        }
        
        let totalOverall = 0;
        let count = 0;
        
        for (const playerId of allPlayerIds) {
          try {
            const player = await playerManager.getPlayer(playerId);
            totalOverall += player.overall;
            count++;
          } catch (e) {
            console.error('Error loading player for avg:', playerId);
          }
        }
        
        const avg = count > 0 ? Math.round(totalOverall / count) : 0;
        document.getElementById('avgOverall').textContent = avg;
      } catch (error) {
        console.error('Error calculating average:', error);
      }
    }

    function goBack() {
      navigateToPage('dashboard.html');
    }

    function addPlayer() {
      navigateToPage('player-add.html', { teamId: teamId });
    }

    function viewPlayer(playerId) {
      navigateToPage('player-card.html', { playerId: playerId });
    }

    function showTeamMenu() {
      const actions = [
        { label: 'Edit Team', action: () => navigateToPage('team-create.html', { teamId: teamId }) },
        { label: 'Share Team', action: shareTeam },
        { label: 'Delete Team', action: deleteTeam }
      ];
      
      const menu = actions.map(a => `<button class="btn btn-block" onclick="${a.action.name}()">${a.label}</button>`).join('');
      
      const modal = document.createElement('div');
      modal.style.cssText = 'position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 1rem; border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-xl); z-index: 1000;';
      modal.innerHTML = menu + '<button class="btn btn-secondary btn-block" onclick="this.parentElement.remove()">Cancel</button>';
      document.body.appendChild(modal);
    }

    async function shareTeam() {
      if (!currentTeam) return;
      await shareData({
        title: `${currentTeam.teamName} - Hoopin'`,
        text: `Check out my team: ${currentTeam.teamName}`,
        url: window.location.href
      });
    }

    async function deleteTeam() {
      if (!teamId) return;
      const team = await dbManager.get('teams', teamId);
      if (!confirm(`Delete ${team.teamName}? This cannot be undone.`)) return;
      
      showLoading('Deleting team...');
      const result = await teamManager.deleteTeam(teamId);
      hideLoading();
      
      if (result.success) {
        showToast('Team deleted', 'success');
        setTimeout(() => navigateToPage('dashboard.html'), 1000);
      } else {
        showToast('Failed to delete team', 'error');
      }
    }

    // Page load
    window.addEventListener('load', async () => {
      console.log('🏀 Roster view loading...');
      
      const urlParams = new URLSearchParams(window.location.search);
      teamId = urlParams.get('teamId');
      
      if (!teamId) {
        showToast('No team ID provided', 'error');
        return;
      }
      
      // Check swap mode
      checkSwapMode();
      
      // Load roster
      await loadRoster();
    });
  </script>
</body>
</html>
