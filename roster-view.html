<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1e2d">
  <title>Team Roster - Hoopin'</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/divisions.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
.swap-mode-banner {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  box-shadow: 0 4px 12px rgba(240, 147, 251, 0.4);
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.swap-banner-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.btn-cancel-swap {
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: 1px solid white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-cancel-swap:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(1.05);
}
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <button class="btn btn-icon" onclick="goBack()" title="Back to Dashboard">← Back</button>
      <div class="logo">🏀 <span id="teamNameHeader"></span></div>
      <button class="btn btn-icon" onclick="showTeamMenu()">⋮</button>
    </div>
  </header>

  <div class="container page-transition">
    <!-- Team Header -->
    <div class="card" style="margin-top: 1rem;">
      <div style="display: flex; gap: 1rem; align-items: center;">
        <div id="teamPhotoContainer"></div>
        <div style="flex: 1;">
          <h2 style="margin: 0 0 0.5rem 0;" id="teamName"></h2>
          <p style="margin: 0; color: var(--text-secondary);" id="teamManager"></p>
          <div id="teamDivision" style="margin-top: 0.5rem;"></div>
        </div>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 1rem;">
        <div style="text-align: center; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md);">
          <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent-primary);" id="totalPlayers">0</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Players</div>
        </div>
        <div style="text-align: center; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md);">
          <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent-primary);" id="avgOverall">0</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Avg OVR</div>
        </div>
        <div style="text-align: center; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md);">
          <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent-primary);" id="startersCount">0</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Starters</div>
        </div>
        <div style="text-align: center; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md);">
          <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent-primary);" id="benchCount">0</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Bench</div>
        </div>
      </div>
    </div>

    <!-- Starters -->
    <h3 style="margin: 2rem 0 1rem 0;">Starting 5</h3>
    <div class="player-cards-scroll" id="startersContainer"></div>

    <!-- Bench -->
    <h3 style="margin: 2rem 0 1rem 0;">Bench</h3>
    <div class="player-cards-scroll" id="benchContainer"></div>
  </div>

  <button class="fab" onclick="addPlayer()" aria-label="Add player">➕</button>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/performance.js"></script>
  <script src="js/db-manager.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/players.js"></script>
  <script src="js/divisions.js"></script>
  <script src="js/app.js"></script>

  <script>
    let teamId = null;
    let currentTeam = null;
    
    // Swap mode state
    let swapMode = false;
    let swapPlayerId = null;
    let swapPlayerName = null;

    function goBack() {
      // Always return to dashboard when viewing a team roster
      navigateToPage('dashboard.html');
    }

    function showSwapBanner() {
      const banner = document.createElement('div');
      banner.className = 'swap-mode-banner';
      banner.innerHTML = `
        <div class="swap-banner-content">
          <span>🔄 Select a player to swap with <strong>${swapPlayerName}</strong></span>
          <button class="btn-cancel-swap" onclick="cancelSwap()">✕ Cancel</button>
        </div>
      `;
      
      const container = document.querySelector('.container');
      const firstCard = container.querySelector('.card');
      if (firstCard) {
        container.insertBefore(banner, firstCard);
      } else {
        container.prepend(banner);
      }
    }

    async function loadTeamRoster() {
      if (!teamId) return;

      showLoading('Loading roster...');

      try {
        currentTeam = await teamManager.getTeam(teamId);
        const { starters, bench } = await teamManager.getTeamRoster(teamId);
        const stats = await teamManager.getTeamStats(teamId);
        const division = await divisionManager.calculateTeamDivision(teamId);

        hideLoading();

        if (!currentTeam) {
          showToast('Team not found', 'error');
          return;
        }

        document.getElementById('teamNameHeader').textContent = currentTeam.teamName;
        document.getElementById('teamName').textContent = currentTeam.teamName;
        document.getElementById('teamManager').textContent = `Manager: ${currentTeam.manager}`;
        
        const photoContainer = document.getElementById('teamPhotoContainer');
        if (currentTeam.teamPhoto) {
          photoContainer.innerHTML = `<img src="${currentTeam.teamPhoto}" style="width: 80px; height: 80px; border-radius: var(--radius-lg); object-fit: cover;">`;
        } else {
          photoContainer.innerHTML = '<div style="width: 80px; height: 80px; background: var(--secondary-bg); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 3rem;">🏀</div>';
        }

        document.getElementById('teamDivision').innerHTML = divisionManager.createDivisionBadge(division.name, 'small');

        document.getElementById('totalPlayers').textContent = stats.totalPlayers;
        document.getElementById('avgOverall').textContent = stats.avgOverall;
        document.getElementById('startersCount').textContent = `${stats.startersCount}/5`;
        document.getElementById('benchCount').textContent = stats.benchCount;

        renderPlayers('startersContainer', starters, 'No starters yet');
        renderPlayers('benchContainer', bench, 'No bench players yet');
      } catch (error) {
        hideLoading();
        console.error('Load roster error:', error);
        showToast('Failed to load roster', 'error');
      }
    }

    function renderPlayers(containerId, players, emptyMessage) {
      const container = document.getElementById(containerId);
      
      if (players.length === 0) {
        container.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-muted);">${emptyMessage}</div>`;
        return;
      }

      container.innerHTML = '';
      
      players.forEach((player, index) => {
        const card = document.createElement('div');
        card.className = `player-card ${player.tierClass} gpu-accelerated`;
        card.dataset.playerId = player.playerId;
        card.dataset.container = containerId;
        
        // Click handler for viewing details or swapping
        card.addEventListener('click', () => {
          handleCardClick(player.playerId);
        });
        
        card.innerHTML = `
          <div class="player-card-header">
            <div class="player-card-overall-badge">
              <div class="overall-number">${player.overall}</div>
            </div>
          </div>
          <div class="player-card-body">
            <div class="player-card-left">
              <div class="player-stats-compact">
                <div class="stat-line-compact"><strong>Face:</strong> ${player.stats?.face || 0}</div>
                <div class="stat-line-compact"><strong>Top:</strong> ${player.stats?.top || 0}</div>
                <div class="stat-line-compact"><strong>Bottom:</strong> ${player.stats?.bottom || 0}</div>
                <div class="stat-line-compact"><strong>Fitness:</strong> ${player.stats?.fitness || 0}</div>
                <div class="stat-line-compact"><strong>Personality:</strong> ${player.stats?.personality || 0}</div>
              </div>
            </div>
            <div class="player-card-right">
              <div class="player-photo-large">
                ${player.playerPhoto 
                  ? `<img src="${player.playerPhoto}" alt="${player.playerName}">`
                  : '<div class="player-icon-large">👤</div>'
                }
              </div>
            </div>
          </div>
          <div class="player-card-footer">
            <div class="player-name-bar">${sanitizeHTML(player.playerName)}</div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    function handleCardClick(playerId) {
      if (swapMode && swapPlayerId) {
        // Don't allow swapping with same player
        if (playerId === swapPlayerId) {
          showToast('Cannot swap a player with themselves!', 'error');
          return;
        }
        
        // Execute the swap
        executeSwap(swapPlayerId, playerId);
      } else {
        // Normal behavior: view player details
        viewPlayer(playerId);
      }
    }

    async function executeSwap(playerId1, playerId2) {
      try {
        showLoading('Swapping players...');
        
        console.log('🔄 Starting swap:', playerId1, '↔️', playerId2);
        
        // Get both players
        const player1 = await playerManager.getPlayer(playerId1);
        const player2 = await playerManager.getPlayer(playerId2);
        
        if (!player1 || !player2) {
          throw new Error('One or both players not found');
        }
        
        console.log('✅ Players loaded:', player1.playerName, player2.playerName);
        
        // Get current team and roster
        const team = await teamManager.getTeam(teamId);
        if (!team || !team.roster) {
          throw new Error('Team roster not found');
        }
        
        const { starters, bench } = team.roster;
        
        console.log('📋 Current roster:', {
          starters: starters.map(id => id),
          bench: bench.map(id => id)
        });
        
        // Find positions of both players
        const pos1Index = starters.indexOf(playerId1);
        const pos2Index = starters.indexOf(playerId2);
        const bench1Index = bench.indexOf(playerId1);
        const bench2Index = bench.indexOf(playerId2);
        
        const pos1 = {
          type: pos1Index !== -1 ? 'starters' : (bench1Index !== -1 ? 'bench' : null),
          index: pos1Index !== -1 ? pos1Index : bench1Index
        };
        
        const pos2 = {
          type: pos2Index !== -1 ? 'starters' : (bench2Index !== -1 ? 'bench' : null),
          index: pos2Index !== -1 ? pos2Index : bench2Index
        };
        
        console.log('📍 Positions found:', { pos1, pos2 });
        
        if (!pos1.type || !pos2.type) {
          throw new Error('Could not find both players in roster');
        }
        
        // Create new roster arrays
        const newStarters = [...starters];
        const newBench = [...bench];
        
        // Perform the swap
        if (pos1.type === 'starters' && pos2.type === 'starters') {
          // Both in starters - simple swap
          newStarters[pos1.index] = playerId2;
          newStarters[pos2.index] = playerId1;
        } else if (pos1.type === 'bench' && pos2.type === 'bench') {
          // Both on bench - simple swap
          newBench[pos1.index] = playerId2;
          newBench[pos2.index] = playerId1;
        } else if (pos1.type === 'starters' && pos2.type === 'bench') {
          // Player1 in starters, Player2 on bench
          newStarters[pos1.index] = playerId2;
          newBench[pos2.index] = playerId1;
        } else if (pos1.type === 'bench' && pos2.type === 'starters') {
          // Player1 on bench, Player2 in starters
          newBench[pos1.index] = playerId2;
          newStarters[pos2.index] = playerId1;
        }
        
        console.log('🔄 New roster:', {
          starters: newStarters,
          bench: newBench
        });
        
        // Update the team roster
        team.roster = {
          starters: newStarters,
          bench: newBench
        };
        
        // Save to database
        await dbManager.save('teams', teamId, team);
        
        console.log('✅ Roster saved to database');
        
        showToast(`Swapped ${player1.playerName} ↔️ ${player2.playerName}`, 'success');
        
        // Exit swap mode
        cancelSwap();
        
        // Reload the roster view
        setTimeout(() => {
          location.reload();
        }, 1000);
        
      } catch (error) {
        console.error('❌ Swap error:', error);
        showToast('Failed to swap players: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    function cancelSwap() {
      swapMode = false;
      swapPlayerId = null;
      swapPlayerName = null;
      
      // Remove banner
      const banner = document.querySelector('.swap-mode-banner');
      if (banner) {
        banner.remove();
      }
      
      // Reload without swap params
      const url = new URL(window.location);
      url.searchParams.delete('swapMode');
      url.searchParams.delete('swapPlayerId');
      window.history.replaceState({}, '', url);
    }

    function addPlayer() {
      navigateToPage('player-add.html', { teamId: teamId });
    }

    function viewPlayer(playerId) {
      navigateToPage('player-card.html', { playerId: playerId });
    }

    function showTeamMenu() {
      const actions = [
        { label: 'Edit Team', action: () => navigateToPage('team-create.html', { teamId: teamId }) },
        { label: 'Share Team', action: shareTeam },
        { label: 'Delete Team', action: deleteTeam }
      ];
      
      const menu = actions.map(a => `<button class="btn btn-block" onclick="${a.action.name}()">${a.label}</button>`).join('');
      
      const modal = document.createElement('div');
      modal.style.cssText = 'position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 1rem; border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-xl); z-index: 1000;';
      modal.innerHTML = menu + '<button class="btn btn-secondary btn-block" onclick="this.parentElement.remove()">Cancel</button>';
      document.body.appendChild(modal);
    }

    async function shareTeam() {
      if (!currentTeam) return;
      await shareData({
        title: `${currentTeam.teamName} - Hoopin'`,
        text: `Check out my team: ${currentTeam.teamName}`,
        url: window.location.href
      });
    }

    async function deleteTeam() {
      if (!currentTeam) return;
      if (!confirm(`Delete ${currentTeam.teamName}? This cannot be undone.`)) return;
      
      showLoading('Deleting team...');
      const result = await teamManager.deleteTeam(teamId);
      hideLoading();
      
      if (result.success) {
        showToast('Team deleted', 'success');
        setTimeout(() => navigateToPage('dashboard.html'), 1000);
      } else {
        showToast('Failed to delete team', 'error');
      }
    }

    window.addEventListener('load', () => {
      setupCommonElements();
      teamId = getQueryParams().teamId;
      
      if (!teamId) {
        showToast('No team specified', 'error');
        navigateToPage('dashboard.html');
        return;
      }
      
      // Check for swap mode
      const urlParams = new URLSearchParams(window.location.search);
      const swapModeParam = urlParams.get('swapMode');
      const swapPlayerIdParam = urlParams.get('swapPlayerId');
      
      if (swapModeParam === 'true' && swapPlayerIdParam) {
        swapMode = true;
        swapPlayerId = swapPlayerIdParam;
        
        // Get player name from the player data
        playerManager.getPlayer(swapPlayerId).then(player => {
          if (player) {
            swapPlayerName = player.playerName;
            showSwapBanner();
          }
        });
      }
      
      loadTeamRoster();
    });
  </script>
</body>
</html>
