<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1e2d">
  <title>Team Roster - Hoopin'</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/divisions.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
/* Position Slots Layout */
.positions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

@media (max-width: 768px) {
  .positions-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
}

.position-slot {
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.2s;
}

.position-slot.swap-mode {
  cursor: pointer;
  border-color: #f093fb;
  box-shadow: 0 0 0 2px rgba(240, 147, 251, 0.3);
}

.position-slot.swap-mode:hover {
  border-color: #f5576c;
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(240, 147, 251, 0.4);
}

.position-label {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 0.5rem;
  text-align: center;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: 1px;
}

.position-content {
  min-height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem;
}

/* Empty slot styling */
.empty-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  height: 100%;
  min-height: 280px;
  color: rgba(255, 255, 255, 0.4);
  font-size: 0.875rem;
  text-align: center;
}

.empty-slot-icon {
  font-size: 3rem;
  opacity: 0.3;
}

.empty-slot.swap-mode {
  color: #f093fb;
  font-weight: 600;
}

.empty-slot.swap-mode .empty-slot-icon {
  opacity: 0.6;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.6;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.8;
  }
}

/* Bench Grid */
.bench-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}

@media (max-width: 768px) {
  .bench-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.bench-slot {
  background: rgba(255, 255, 255, 0.03);
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem;
  transition: all 0.2s;
  position: relative;
}

.bench-slot::before {
  content: attr(data-slot-number);
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.5);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 700;
}

.bench-slot.swap-mode {
  cursor: pointer;
  border-color: #f093fb;
  border-style: solid;
}

.bench-slot.swap-mode:hover {
  border-color: #f5576c;
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(240, 147, 251, 0.3);
}

/* Player cards in slots - make them smaller */
.position-content .player-card-mini,
.bench-slot .player-card-mini {
  width: 100%;
  max-width: 100%;
  margin: 0;
  cursor: pointer;
}

/* Swap mode banner */
.swap-mode-banner {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  padding: 1rem 1.25rem;
  border-radius: 12px;
  margin-bottom: 1.5rem;
  box-shadow: 0 6px 20px rgba(240, 147, 251, 0.5);
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.swap-banner-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.swap-banner-text {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 1rem;
  font-weight: 600;
}

.btn-cancel-swap {
  background: rgba(255, 255, 255, 0.25);
  color: white;
  border: 2px solid white;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.2s;
}

.btn-cancel-swap:hover {
  background: rgba(255, 255, 255, 0.35);
}

/* Mini player card CSS */
.player-card-mini {
  width: 100%;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s;
}

.player-card-mini:hover {
  transform: translateY(-4px);
}

.player-mini-overall {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 0.5rem;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 900;
}

.player-mini-photo {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.2);
}

.player-mini-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-icon {
  font-size: 3rem;
  opacity: 0.4;
}

.player-mini-name {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 0.5rem;
  text-align: center;
  font-size: 0.875rem;
  font-weight: 700;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <button class="btn btn-icon" onclick="goBack()" title="Back to Dashboard">← Back</button>
      <div class="logo">🏀 <span id="teamNameHeader"></span></div>
      <button class="btn btn-icon" onclick="showTeamMenu()">⋮</button>
    </div>
  </header>

  <div class="container page-transition">
    <!-- Swap banner will be inserted here dynamically -->
    
    <div class="team-header" style="margin-top: 1rem;">
      <h1 id="teamName" style="font-size: 2rem; margin-bottom: 1rem;">Team Roster</h1>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem;">
        <div style="text-align: center; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px;">
          <div style="font-size: 2rem; font-weight: 700; color: var(--accent-primary);" id="totalPlayers">0</div>
          <div style="font-size: 0.875rem; color: var(--text-muted);">Players</div>
        </div>
        <div style="text-align: center; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px;">
          <div style="font-size: 2rem; font-weight: 700; color: var(--accent-primary);" id="avgOverall">0</div>
          <div style="font-size: 0.875rem; color: var(--text-muted);">Avg OVR</div>
        </div>
      </div>
    </div>

    <!-- Starting 5 Positions -->
    <section class="roster-section">
      <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Starting 5</h2>
      <div class="positions-grid">
        <div class="position-slot" data-position="PG">
          <div class="position-label">PG</div>
          <div class="position-content" id="position-PG">
            <!-- Player card or empty slot will be inserted here -->
          </div>
        </div>
        
        <div class="position-slot" data-position="SG">
          <div class="position-label">SG</div>
          <div class="position-content" id="position-SG"></div>
        </div>
        
        <div class="position-slot" data-position="SF">
          <div class="position-label">SF</div>
          <div class="position-content" id="position-SF"></div>
        </div>
        
        <div class="position-slot" data-position="PF">
          <div class="position-label">PF</div>
          <div class="position-content" id="position-PF"></div>
        </div>
        
        <div class="position-slot" data-position="C">
          <div class="position-label">C</div>
          <div class="position-content" id="position-C"></div>
        </div>
      </div>
    </section>

    <!-- Bench - 10 Slots -->
    <section class="roster-section" style="margin-top: 2rem;">
      <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Bench (10 Slots)</h2>
      <div class="bench-grid" id="benchGrid">
        <!-- 10 bench slots will be generated here -->
      </div>
    </section>

    <div class="roster-actions" style="margin-top: 2rem; text-align: center;">
      <button class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;" onclick="addPlayer()">
        <span style="font-size: 1.2rem;">➕</span> Add Player
      </button>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/performance.js"></script>
  <script src="js/db-manager.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/players.js"></script>
  <script src="js/divisions.js"></script>
  <script src="js/app.js"></script>

  <script>
    let teamId = null;
    let currentRoster = null;
    
    // Swap mode state
    let swapMode = {
      active: false,
      sourcePlayerId: null,
      sourcePlayerName: null,
      sourcePosition: null // 'PG', 'SG', 'SF', 'PF', 'C', or 'bench-0', 'bench-1', etc.
    };

    // Check swap mode from session storage
    function checkSwapMode() {
      const storedPlayerId = sessionStorage.getItem('swapPlayerId');
      const storedPlayerName = sessionStorage.getItem('swapPlayerName');
      const storedPosition = sessionStorage.getItem('swapPosition');
      
      if (storedPlayerId && storedPlayerName && storedPosition) {
        swapMode.active = true;
        swapMode.sourcePlayerId = storedPlayerId;
        swapMode.sourcePlayerName = storedPlayerName;
        swapMode.sourcePosition = storedPosition;
        
        console.log('🔄 SWAP MODE ACTIVE');
        console.log('  Player:', storedPlayerName, storedPlayerId);
        console.log('  Current position:', storedPosition);
        
        showSwapBanner();
        return true;
      }
      return false;
    }

    function showSwapBanner() {
      const existingBanner = document.querySelector('.swap-mode-banner');
      if (existingBanner) {
        existingBanner.remove();
      }
      
      const banner = document.createElement('div');
      banner.className = 'swap-mode-banner';
      banner.innerHTML = `
        <div class="swap-banner-content">
          <div class="swap-banner-text">
            <span style="font-size: 1.5rem;">🔄</span>
            <strong>SWAP MODE:</strong>
            <span>Click any position or bench slot to move <strong>${swapMode.sourcePlayerName}</strong> there</span>
          </div>
          <button class="btn-cancel-swap" onclick="cancelSwapMode()">
            ✕ Cancel
          </button>
        </div>
      `;
      
      const container = document.querySelector('.container');
      if (container) {
        container.insertBefore(banner, container.firstChild);
      }
    }

    function cancelSwapMode() {
      swapMode.active = false;
      swapMode.sourcePlayerId = null;
      swapMode.sourcePlayerName = null;
      swapMode.sourcePosition = null;
      
      sessionStorage.removeItem('swapPlayerId');
      sessionStorage.removeItem('swapPlayerName');
      sessionStorage.removeItem('swapPosition');
      
      const banner = document.querySelector('.swap-mode-banner');
      if (banner) {
        banner.remove();
      }
      
      location.reload();
    }

    // Load and display roster
    async function loadRoster() {
      try {
        showLoading('Loading roster...');
        
        console.log('📋 Loading roster for team:', teamId);
        
        // Get team and migrate if needed
        let team = await dbManager.get('teams', teamId);
        
        if (!team) {
          throw new Error('Team not found');
        }
        
        // Migrate to position format if needed
        if (!team.roster || !team.roster.positions) {
          console.log('🔄 Migrating roster format...');
          team = await migrateRosterToPositions(teamId);
        }
        
        currentRoster = team.roster;
        
        console.log('📋 Current roster:', currentRoster);
        
        // Update team name
        document.getElementById('teamName').textContent = team.teamName;
        document.getElementById('teamNameHeader').textContent = team.teamName;
        
        // Render starting positions
        await renderPositions(currentRoster.positions);
        
        // Render bench
        await renderBench(currentRoster.bench);
        
        // Update stats
        await updateRosterStats(currentRoster);
        
        // Apply swap mode styling if active
        if (swapMode.active) {
          enableSwapModeUI();
        }
        
      } catch (error) {
        console.error('❌ Error loading roster:', error);
        showToast('Failed to load roster: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    // Render starting positions
    async function renderPositions(positions) {
      const positionKeys = ['PG', 'SG', 'SF', 'PF', 'C'];
      
      for (const pos of positionKeys) {
        const container = document.getElementById(`position-${pos}`);
        const playerId = positions[pos];
        
        if (playerId) {
          // Load and render player
          try {
            const player = await playerManager.getPlayer(playerId);
            container.innerHTML = renderPlayerCardMini(player);
            
            // Add click handler
            container.querySelector('.player-card-mini').addEventListener('click', (e) => {
              handleSlotClick(pos, playerId, player.playerName);
            });
          } catch (error) {
            console.error(`Error loading player for ${pos}:`, error);
            container.innerHTML = renderEmptySlot(pos);
          }
        } else {
          // Empty slot
          container.innerHTML = renderEmptySlot(pos);
          container.addEventListener('click', () => {
            handleSlotClick(pos, null, null);
          });
        }
      }
    }

    // Render bench slots
    async function renderBench(benchSlots) {
      const benchGrid = document.getElementById('benchGrid');
      benchGrid.innerHTML = '';
      
      for (let i = 0; i < 10; i++) {
        const slot = document.createElement('div');
        slot.className = 'bench-slot';
        slot.dataset.slotNumber = `Bench ${i + 1}`;
        slot.dataset.position = `bench-${i}`;
        
        const playerId = benchSlots[i];
        
        if (playerId) {
          // Load and render player
          try {
            const player = await playerManager.getPlayer(playerId);
            slot.innerHTML = renderPlayerCardMini(player);
            
            // Add click handler
            slot.querySelector('.player-card-mini').addEventListener('click', (e) => {
              handleSlotClick(`bench-${i}`, playerId, player.playerName);
            });
          } catch (error) {
            console.error(`Error loading bench player ${i}:`, error);
            slot.innerHTML = renderEmptySlot(`bench-${i}`);
          }
        } else {
          // Empty slot
          slot.innerHTML = renderEmptySlot(`bench-${i}`);
          slot.addEventListener('click', () => {
            handleSlotClick(`bench-${i}`, null, null);
          });
        }
        
        benchGrid.appendChild(slot);
      }
    }

    // Render mini player card for slots
    function renderPlayerCardMini(player) {
      return `
        <div class="player-card-mini ${player.tierClass}" data-player-id="${player.playerId}">
          <div class="player-mini-overall">${player.overall}</div>
          <div class="player-mini-photo">
            ${player.playerPhoto 
              ? `<img src="${player.playerPhoto}" alt="${player.playerName}">`
              : '<div class="player-icon">👤</div>'
            }
          </div>
          <div class="player-mini-name">${sanitizeHTML(player.playerName)}</div>
        </div>
      `;
    }

    // Render empty slot
    function renderEmptySlot(position) {
      return `
        <div class="empty-slot ${swapMode.active ? 'swap-mode' : ''}">
          <div class="empty-slot-icon">${swapMode.active ? '🎯' : '➕'}</div>
          <div>${swapMode.active ? 'Click to move here' : 'Empty'}</div>
        </div>
      `;
    }

    // Handle slot click (view player or swap)
    function handleSlotClick(position, playerId, playerName) {
      if (swapMode.active) {
        // SWAP MODE - execute swap
        console.log('🎯 Slot clicked in swap mode:', position);
        
        if (position === swapMode.sourcePosition) {
          showToast('Player is already in this position!', 'error');
          return;
        }
        
        // Confirm swap
        const destLabel = position.startsWith('bench') 
          ? `Bench slot ${parseInt(position.split('-')[1]) + 1}`
          : position;
        
        const currentLabel = swapMode.sourcePosition.startsWith('bench')
          ? `Bench slot ${parseInt(swapMode.sourcePosition.split('-')[1]) + 1}`
          : swapMode.sourcePosition;
        
        const targetName = playerName || 'Empty spot';
        
        const confirmed = confirm(
          `Move ${swapMode.sourcePlayerName} from ${currentLabel} to ${destLabel}?\n\n` +
          `${targetName} will ${playerName ? `move to ${currentLabel}` : 'stay empty'}.`
        );
        
        if (confirmed) {
          performSlotSwap(swapMode.sourcePosition, position);
        }
      } else {
        // NORMAL MODE - view player details
        if (playerId) {
          viewPlayer(playerId);
        } else {
          // Empty slot - add player
          addPlayer();
        }
      }
    }

    // Perform slot swap
    async function performSlotSwap(sourcePos, targetPos) {
      try {
        showLoading('Swapping positions...');
        
        console.log('═══════════════════════════════════════');
        console.log('🔄 PERFORMING SLOT SWAP');
        console.log('  From:', sourcePos);
        console.log('  To:', targetPos);
        
        const team = await dbManager.get('teams', teamId);
        
        if (!team || !team.roster) {
          throw new Error('Team or roster not found');
        }
        
        const roster = team.roster;
        
        console.log('📋 Current roster:', roster);
        
        // Get player IDs from source and target
        let sourcePlayerId, targetPlayerId;
        
        // Get source player ID
        if (sourcePos.startsWith('bench')) {
          const benchIdx = parseInt(sourcePos.split('-')[1]);
          sourcePlayerId = roster.bench[benchIdx];
        } else {
          sourcePlayerId = roster.positions[sourcePos];
        }
        
        // Get target player ID (may be null if empty)
        if (targetPos.startsWith('bench')) {
          const benchIdx = parseInt(targetPos.split('-')[1]);
          targetPlayerId = roster.bench[benchIdx] || null;
        } else {
          targetPlayerId = roster.positions[targetPos] || null;
        }
        
        console.log('📍 Players:');
        console.log('  Source player:', sourcePlayerId);
        console.log('  Target player:', targetPlayerId);
        
        // Perform swap
        if (sourcePos.startsWith('bench')) {
          const benchIdx = parseInt(sourcePos.split('-')[1]);
          roster.bench[benchIdx] = targetPlayerId;
        } else {
          roster.positions[sourcePos] = targetPlayerId;
        }
        
        if (targetPos.startsWith('bench')) {
          const benchIdx = parseInt(targetPos.split('-')[1]);
          roster.bench[benchIdx] = sourcePlayerId;
        } else {
          roster.positions[targetPos] = sourcePlayerId;
        }
        
        console.log('📋 New roster:', roster);
        
        // Save
        team.roster = roster;
        team.updatedAt = new Date().toISOString();
        
        console.log('💾 Saving...');
        await dbManager.save('teams', teamId, team);
        
        // Verify
        const verifyTeam = await dbManager.get('teams', teamId);
        console.log('🔍 Verification:', verifyTeam.roster);
        console.log('═══════════════════════════════════════');
        console.log('✅ SWAP COMPLETE');
        console.log('═══════════════════════════════════════');
        
        showToast('✅ Position updated!', 'success');
        
        // Clear swap mode
        sessionStorage.removeItem('swapPlayerId');
        sessionStorage.removeItem('swapPlayerName');
        sessionStorage.removeItem('swapPosition');
        
        // Reload
        setTimeout(() => {
          window.location.reload();
        }, 1000);
        
      } catch (error) {
        console.error('═══════════════════════════════════════');
        console.error('❌ SWAP FAILED');
        console.error('Error:', error);
        console.error('═══════════════════════════════════════');
        showToast('Swap failed: ' + error.message, 'error');
      } finally {
        hideLoading();
      }
    }

    // Enable swap mode UI
    function enableSwapModeUI() {
      // Add swap-mode class to all slots
      document.querySelectorAll('.position-slot, .bench-slot').forEach(slot => {
        slot.classList.add('swap-mode');
      });
      
      // Update empty slots
      document.querySelectorAll('.empty-slot').forEach(slot => {
        slot.classList.add('swap-mode');
        slot.querySelector('.empty-slot-icon').textContent = '🎯';
        slot.querySelector('div:last-child').textContent = 'Click to move here';
      });
    }

    // Update roster stats
    async function updateRosterStats(roster) {
      let totalPlayers = 0;
      let totalOverall = 0;
      
      // Count positions
      for (const pos of ['PG', 'SG', 'SF', 'PF', 'C']) {
        if (roster.positions[pos]) {
          totalPlayers++;
          try {
            const player = await playerManager.getPlayer(roster.positions[pos]);
            totalOverall += player.overall;
          } catch (e) {}
        }
      }
      
      // Count bench
      for (const playerId of roster.bench) {
        if (playerId) {
          totalPlayers++;
          try {
            const player = await playerManager.getPlayer(playerId);
            totalOverall += player.overall;
          } catch (e) {}
        }
      }
      
      document.getElementById('totalPlayers').textContent = totalPlayers;
      document.getElementById('avgOverall').textContent = totalPlayers > 0 
        ? Math.round(totalOverall / totalPlayers) 
        : 0;
    }

    // Helper: Find player position in roster
    function findPlayerPosition(roster, playerId) {
      // Check positions
      for (const [pos, id] of Object.entries(roster.positions)) {
        if (id === playerId) {
          return pos;
        }
      }
      
      // Check bench
      const benchIdx = roster.bench.indexOf(playerId);
      if (benchIdx >= 0) {
        return `bench-${benchIdx}`;
      }
      
      return null;
    }

    function goBack() {
      navigateToPage('dashboard.html');
    }

    function addPlayer() {
      navigateToPage('player-add.html', { teamId: teamId });
    }

    function viewPlayer(playerId) {
      navigateToPage('player-card.html', { playerId: playerId });
    }

    function showTeamMenu() {
      const actions = [
        { label: 'Edit Team', action: () => navigateToPage('team-create.html', { teamId: teamId }) },
        { label: 'Share Team', action: shareTeam },
        { label: 'Delete Team', action: deleteTeam }
      ];
      
      const menu = actions.map(a => `<button class="btn btn-block" onclick="${a.action.name}()">${a.label}</button>`).join('');
      
      const modal = document.createElement('div');
      modal.style.cssText = 'position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 1rem; border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-xl); z-index: 1000;';
      modal.innerHTML = menu + '<button class="btn btn-secondary btn-block" onclick="this.parentElement.remove()">Cancel</button>';
      document.body.appendChild(modal);
    }

    async function shareTeam() {
      if (!currentRoster) return;
      const team = await dbManager.get('teams', teamId);
      await shareData({
        title: `${team.teamName} - Hoopin'`,
        text: `Check out my team: ${team.teamName}`,
        url: window.location.href
      });
    }

    async function deleteTeam() {
      if (!teamId) return;
      const team = await dbManager.get('teams', teamId);
      if (!confirm(`Delete ${team.teamName}? This cannot be undone.`)) return;
      
      showLoading('Deleting team...');
      const result = await teamManager.deleteTeam(teamId);
      hideLoading();
      
      if (result.success) {
        showToast('Team deleted', 'success');
        setTimeout(() => navigateToPage('dashboard.html'), 1000);
      } else {
        showToast('Failed to delete team', 'error');
      }
    }

    // Page load
    window.addEventListener('load', async () => {
      console.log('🏀 Roster view loading...');
      
      const urlParams = new URLSearchParams(window.location.search);
      teamId = urlParams.get('teamId');
      
      if (!teamId) {
        showToast('No team ID provided', 'error');
        return;
      }
      
      // Check swap mode
      checkSwapMode();
      
      // Load roster
      await loadRoster();
    });
  </script>
</body>
</html>
